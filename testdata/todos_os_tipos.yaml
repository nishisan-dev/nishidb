version: 1

# Dataset de teste com UM campo de cada tipo do wire format. Existe para o
# teste de propriedade cruzado ingestão × query: o YAML da spec §12 não cobre
# double, boolean, bytes, json nem os prefixos, e é justamente nesses tipos que
# uma divergência entre o parser da ingestão e o da query passa despercebida —
# ela aparece como resultado VAZIO, não como erro.
name: todos_os_tipos
schemaName: telecom

materialization:
  key:
    source: payload
    field: id
    type: string
  mode: merge
  sequence:
    field: _SEQ
    type: int64
    strategy: greater

schema:
  include:
    - "*"
  unknownFields: include
  fields:
    id:
      type: string
    _SEQ:
      type: int64
    texto:
      type: string
      alias: t
      index: true
    inteiro:
      type: int64
    real:
      type: double
    booleano:
      type: boolean
    quando:
      type: timestamp
    v4:
      type: ipv4
      index: true
    v6:
      type: ipv6
    rede4:
      type: ipv4_prefix
    rede6:
      type: ipv6_prefix
    cru:
      type: bytes
    doc:
      type: json
    # Os dois formatos vezes os dois tipos temporais. datetime resolve o
    # wall-clock com o fuso do HOST, então todo caso que envolva epoch millis
    # tem de ser montado em runtime — ver o teste cruzado.
    momento:
      type: datetime
      format: "MMM d, yyyy hh:mm:ss a"
    momento_iso:
      type: datetime
      format: "yyyy-MM-dd'T'HH:mm:ss"
    hora:
      type: time
      format: "hh:mm:ss a"
    hora_iso:
      type: time
      format: "HH:mm:ss.SSS"

# Um contador mínimo com UMA métrica de janela, para que os testes de
# integração dos clients vejam `_counters.rows_by_text` e
# `_meta.counter_metrics` no servidor real. O `texto` é a única coluna string
# que não é a key; as linhas de volume repetem poucos valores nele, então o
# contador tem poucos grupos.
counters:
  - name: rows_by_text
    groupBy: [texto]
    metrics:
      - name: rows_5m
        type: window
        source: total
        window: 5m
        aggregates: [avg, max]

  - name: events_by_text
    groupBy: [texto]
    total: false
    measures:
      - name: event_rate
        window: 1h
        unit: second
    metrics:
      - name: rates_1m
        type: window
        source: event_rate
        window: 1m
        aggregates: [avg, min, max]

query:
  maxRows: 1000
  timeout: 30s
