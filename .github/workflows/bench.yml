name: Bench (micro)

# Só por acionamento manual: os micro-benchmarks appendam centenas de MiB por
# rodada com fallocate real, e comparação com benchstat exige as mesmas
# contagens de iteração dos baselines em benchmark/baselines/ — não faz
# sentido rodar isso a cada pull_request ou push. O benchmark/ingest-bench
# com Kafka real fica de fora: é rodada de aceite manual, não entra em CI.
on:
  workflow_dispatch:
    inputs:
      bench_dir:
        description: >-
          Diretório em disco REAL do runner para NISHIDB_BENCH_DIR (os
          benchmarks de escrita fazem fallocate de verdade; em tmpfs
          travariam a máquina)
        required: true

jobs:
  bench-micro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: roda os micro-benchmarks (make bench-micro)
        env:
          NISHIDB_BENCH_DIR: ${{ github.event.inputs.bench_dir }}
        run: make bench-micro
