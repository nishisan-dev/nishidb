name: Release

# Disparado pela publicação de uma release já existente. A criação da
# release/tag em si é ato manual (`gh release create` antes da tag) — este
# workflow só builda e anexa o binário, nunca cria a release.
on:
  release:
    types: [published]

jobs:
  anexa-binario:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      # O alvo `build` do Makefile é a ÚNICA fonte do comando de build — nunca
      # um `go build` próprio aqui. A Task A3 acrescenta ldflags de versão a
      # este mesmo alvo, e este workflow herda a mudança sem precisar ser
      # tocado de novo.
      - name: builda com o alvo do Makefile
        run: make build

      - name: renomeia e anexa o binário à release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f ./nishidb ]; then
            echo "erro: 'make build' não deixou ./nishidb no diretório de trabalho — o alvo build ainda não emite o binário nomeado (ver Task A3)." >&2
            exit 1
          fi

          versao="${{ github.event.release.tag_name }}"
          artefato="nishidb-${versao}-linux-amd64"
          cp ./nishidb "$artefato"
          gh release upload "$versao" "$artefato" --clobber
