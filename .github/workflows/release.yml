name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Publication and retention share one queue across all tags.
concurrency:
  group: nishidb-releases
  queue: max
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.created == true && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate release tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if python3 scripts/release.py validate "$RELEASE_TAG"; then
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          fi

  anexa-binario:
    needs: validate
    if: needs.validate.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
      JDBC_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: clients/jdbc/pom.xml
      - name: Test Go and release automation
        run: |
          go test ./...
          python3 scripts/release_test.py
      - name: Test JDBC against the real server
        run: make test-jdbc
      - name: Build release artifacts
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            export CGO_ENABLED=0
            export GOARCH="$arch"
            export DEB_ARCH="$arch"
            export DEB_VERSION="${VERSION#v}"
            make build
            make build-deb
            cp nishidb "dist/nishidb-${VERSION}-linux-${arch}"
          done
          unset CGO_ENABLED GOARCH DEB_ARCH DEB_VERSION
          make build-jdbc
          cp clients/jdbc/target/nishidb-jdbc.jar dist/nishidb-jdbc.jar
          ls -l dist
      - name: Verify packaged .deb assets
        run: |
          for deb in dist/*.deb; do
            echo "== $deb =="
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          done
      - name: Publish all release assets and retain five releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release.py publish "$VERSION" dist
