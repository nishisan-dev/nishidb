name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Suíte completa, INCLUINDO os gates de medida — os de alocação
  # (testing.AllocsPerRun) e o de vazão da ingestão pelo CLI —, que são
  # //go:build !race por construção. É este job que protege o orçamento de
  # alocações por evento e o custo por evento do comando.
  #
  # timeout-minutes generoso: localmente a suíte já leva ~2 min (internal/cli
  # sozinho leva 60s, com os e2e de compaction e vazão), e o runner é mais
  # lento que a máquina de desenvolvimento.
  test:
    name: test (./...)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - run: go test ./...

      # scripts/nishidb-stats.py é código de produção (o painel do operador);
      # sem este passo, nishidb-stats_test.py só rodava pela mão de quem
      # lembrasse — a próxima alteração no painel podia quebrar a exibição da
      # versão (Task A3) sem que nada acusasse. ubuntu-latest já traz
      # python3; nenhum setup extra.
      - name: testa o painel Python (scripts/nishidb-stats.py)
        run: make test-python

  # Detector de corrida. NÃO cobre os gates de medida do job `test`: a
  # instrumentação do -race altera a contagem de alocações e infla o Apply
  # sem inflar o checkpoint, então eles se anunciam SKIP sob -race. Os dois
  # jobs são complementares por construção — nenhum substitui o outro —, e
  # por isso rodam em paralelo, não em sequência.
  race:
    name: test -race
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - run: go test ./... -race

  # golangci-lint na MESMA versão que a instrução de instalação do Makefile —
  # internal/gates/ci_test.go fixa que as duas nunca divergem, comparando as
  # duas extrações. `make lint` não serve de veredito aqui: com a
  # linha de base > 0 o alvo sempre sai != 0 (é assim que ele recusa a
  # ausência do binário). Este job roda o linter direto, com os DOIS tetos
  # zerados (--max-issues-per-linter=0 --max-same-issues=0, que já são o
  # default do .golangci.yml — repetir na linha de comando é o que defende o
  # número real, ver o comentário do alvo `lint`), extrai a CONTAGEM em JSON e
  # compara com .golangci-baseline: ratchet bidirecional, contagem maior OU
  # menor reprovam.
  # O driver JDBC contra o BINÁRIO REAL, e não contra o servidor de mentira dos
  # unitários.
  #
  # `make test-jdbc-unit` fala com o servidor HTTP do próprio JDK, respondendo o
  # que o autor do teste escreveu — ele prova que o driver faz o que quem o
  # escreveu ACHA que o servidor emite. Este job roda a outra metade: sobe o
  # binário com TLS e credencial, ingere um corpus com um campo de cada tipo, e
  # deixa o driver falar com ele. É onde uma divergência entre o fio suposto e o
  # fio real aparece.
  #
  # O alvo seta NISHIDB_IT_REQUIRED=1, e é isso que impede o pior desfecho:
  # harness quebrado com suíte VERDE e zero teste de integração executado — o
  # débito 53 por uma porta nova.
  #
  # Go junto com Java porque o script compila o servidor a partir da árvore,
  # pelo alvo do Makefile (é ele que carimba os ldflags de versão, e um dos
  # testes confere que o driver publica essa versão).
  #
  # timeout generoso: a ingestão do corpus de 120 mil linhas mais a suíte Java
  # levam ~2 min localmente, e o runner é mais lento.
  jdbc:
    name: test-jdbc (driver contra o binário real)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - uses: actions/setup-java@v4
        with:
          # EXATA, e igual ao maven.compiler.release do pom — um gate compara
          # as duas extrações. Faixa (`21.x`) deixaria o runner escolher o
          # patch, e o CI compilaria com um compilador que ninguém mediu.
          java-version: '21'
          # Fixada, e não o default da action: distribuições diferentes trazem
          # defaults de TLS diferentes, e este job depende de handshake com
          # certificado gerado na hora.
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: clients/jdbc/pom.xml
      - name: roda o driver contra um servidor de verdade
        run: make test-jdbc

  # O client Python contra o BINÁRIO REAL, pela mesma razão do job `jdbc` e com
  # a mesma montagem (os dois scripts compartilham scripts/it-comum.sh, para que
  # os dois clients sejam provados contra o MESMO corpus).
  #
  # O job `test` já roda `make test-python`, que são os unitários contra um
  # `http.server` da stdlib — eles provam que o client faz o que quem o escreveu
  # acha que o servidor emite. Este job roda a outra metade, e ela paga: o bug
  # de reuso de conexão que a versão inicial tinha só apareceu AQUI, porque o
  # servidor real responde `/v1/query` em chunked e o de mentira respondia com
  # Content-Length. O servidor de mentira passou a falar chunked por causa
  # disso, mas o job continua sendo a única prova contra o fio de verdade.
  python:
    name: test-python-it (client contra o binário real)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - uses: actions/setup-python@v5
        with:
          # EXATA, e igual ao piso do requires-python do pyproject — um gate
          # compara as duas extrações. Faixa deixaria o runner escolher o
          # patch, e o CI validaria um interpretador que ninguém mediu.
          python-version: '3.10'
      - name: roda o client contra um servidor de verdade
        run: make test-python-it

  # Lint e tipagem do client Python. Job PRÓPRIO, e não um passo do `test`,
  # porque exige instalar ferramenta — e `make test-python` tem de continuar
  # rodando com zero `pip install`, que é a promessa que o torna executável em
  # qualquer máquina.
  python-lint:
    name: lint-python (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: instala as ferramentas nas versões que o pyproject fixa
        run: pip install -e 'clients/python[dev]'
      - run: make lint-python

  lint:
    name: lint (golangci-lint + gofmt)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: instala o golangci-lint na versão que mede a linha de base
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: roda o linter e compara a contagem com a linha de base
        run: |
          # Isolado num diretório próprio do runner, e não no cache default
          # do golangci-lint: o job não reaproveita estado entre execuções.
          # O contexto `runner` não é permitido em `env:` de nível de job —
          # só dentro de steps —, então o isolamento é feito aqui, com
          # RUNNER_TEMP: variável de ambiente do runner, resolvida em
          # runtime pelo shell, sem depender de expressão de contexto do
          # Actions.
          export GOLANGCI_LINT_CACHE="$RUNNER_TEMP/golangci-lint-cache"
          mkdir -p "$GOLANGCI_LINT_CACHE"

          # internal/gates/ci_test.go já fixa que .golangci-baseline existe
          # e contém um inteiro, e o job `test` reprova se ele sumir — mas
          # esse job roda em paralelo, sem depender do resultado do `test`.
          # A checagem abaixo é só para o OPERADOR: sem ela, a ausência do
          # arquivo aparece como "cat: .golangci-baseline: No such file or
          # directory" no meio do script, sem nomear o que falta.
          if [ ! -f .golangci-baseline ]; then
            echo "erro: .golangci-baseline não existe — o job lint não tem contra o que comparar a contagem." >&2
            exit 1
          fi

          # O exit code NÃO é o veredito: com a linha de base > 0 o linter
          # sempre sai != 0. O veredito é a comparação abaixo, contra
          # .golangci-baseline.
          golangci-lint run \
            --max-issues-per-linter=0 --max-same-issues=0 \
            --show-stats=false --output.json.path=lint-report.json || true

          contagem="$(jq '.Issues | length' lint-report.json)"
          baseline="$(cat .golangci-baseline)"
          echo "apontamentos: $contagem (linha de base: $baseline)"

          if [ "$contagem" -gt "$baseline" ]; then
            echo "erro: $contagem apontamentos contra a linha de base de $baseline — há apontamento NOVO no diff." >&2
            exit 1
          fi
          if [ "$contagem" -lt "$baseline" ]; then
            echo "erro: $contagem apontamentos é MENOR que a linha de base de $baseline — abaixe .golangci-baseline para $contagem neste mesmo PR." >&2
            exit 1
          fi

      # Hoje `gofmt -l .` está limpo na base — o job nasce estrito, sem
      # ratchet: formatação não tem meio-termo como a contagem de lint.
      - name: gofmt -l (formatação estrita)
        run: |
          faltando="$(gofmt -l .)"
          if [ -n "$faltando" ]; then
            echo "os arquivos abaixo não passaram por gofmt -l:" >&2
            echo "$faltando" >&2
            exit 1
          fi
