# O wrapper é only-script DE PROPÓSITO: versiona mvnw, mvnw.cmd e este
# arquivo, e NENHUM .jar. Commitar um binário opaco de 60 KB para buscar o
# Maven seria o oposto exato da doutrina do binário único, que existe para que
# o que roda seja o que se pode ler.
#
# A versão do Maven é EXATA, e o checksum está aqui pela mesma razão que a
# versão do golangci-lint está no Makefile: ferramenta é configuração, e uma
# versão solta faz o build de amanhã ser outro build sem que nada acuse. O
# sha256 abaixo foi calculado sobre o zip cujo sha512 confere com o publicado
# pela Apache em repo.maven.apache.org.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
distributionSha256Sum=5af3b743dd8b876b5c45da33b676251e5f1687712644abb4ee519ca56e1d89ce
